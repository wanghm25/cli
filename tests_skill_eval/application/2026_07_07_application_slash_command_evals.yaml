# Domain: application | Spec: 2026_07_07_application_slash_command
# 场景对齐 spec §7（S1-S5），第 6 条为补充的正向 list 决策点（spec 未列、不矛盾）。
# 依赖资源见 tests_skill_eval/setup/application_setup.yaml（{{RUN_TAG}} 由 entrypoint 注入，两边同值）。

- case_id: lark_cli_2026_07_07_application_slash_command_001
  query: "给我们的应用机器人加一个 /weather-{{RUN_TAG}} 斜杠指令，默认描述写'查天气'，另外中文和英文两种语言的描述文案也要配上（中文'查天气'，英文'Check weather'）。"
  expectations: "决策点：参数推断（S1，i18n 多语言参数组装）。AI 应使用 application 域的斜杠指令创建命令，一次调用同时提供：指令名 weather-{{RUN_TAG}}（不带前导斜杠）、默认描述'查天气'、以及 zh_cn 和 en_us 两条多语言描述（通过可重复的 i18n 参数以 <lang>=<text> 形式传入）。不接受：只设默认描述而丢掉双语要求、把语言文案拼进默认描述、或指令名带前导 /。成功后返回完整资源对象且 action 为 created。"

- case_id: lark_cli_2026_07_07_application_slash_command_002
  query: "帮我在应用里注册一个 /greet-{{RUN_TAG}} 斜杠指令，描述是'发送问候'。这个指令之前可能已经配过了，我不确定；不管之前有没有，最终保证它存在，而且描述要是我刚说的这版。"
  expectations: "决策点：错误恢复/幂等（S2，撞名处理）。该指令已由 setup 预建（旧描述不同）。AI 应预判撞名可能：要么直接在创建命令上带 force 类参数实现幂等 upsert（撞名自动转更新），要么先用 list 查询确认已存在后走更新命令；若先裸创建收到 'command already exists' 错误，应按错误提示改用 force 重试或转更新命令，而不是放弃或告诉用户'已存在所以无法操作'。最终该指令存在且描述为'发送问候'（action 为 updated 或等效结果）。"

- case_id: lark_cli_2026_07_07_application_slash_command_003
  query: "把我们应用里 /standup-{{RUN_TAG}} 这个斜杠指令的描述改成'汇报每日进展'。"
  expectations: "决策点：参数推断/路径选择（S3，按名直达 vs 先查 id）。用户只给了指令名、没给 command_id。AI 应直接使用更新命令的按名参数（传指令名 standup-{{RUN_TAG}}，不带前导斜杠）定位目标并修改描述，一步完成；命令内部会自动按名解析。不理想的路径：先跑 list 全量输出、人工提取 command_id、再按 id 更新——结果虽对但多余，评分应偏好按名直达。不接受：误用创建命令导致撞名报错后才纠正、或修改了描述以外的字段。"

- case_id: lark_cli_2026_07_07_application_slash_command_004
  query: "我们应用里的 /obsolete-{{RUN_TAG}} 指令已经没人用了，把它删掉吧。"
  expectations: "决策点：高风险写操作确认流程（S4）。删除斜杠指令是 high-risk-write。AI 应表现出确认意识：先向用户确认删除意图或明确说明这是不可逆删除及其影响（已删指令在客户端可能残留约 5 分钟缓存）；执行时需带确认参数（--yes 类）才能真正删除；若首次不带确认参数执行收到 exit 10 / confirmation_required，应在确认后带确认参数重试，而不是把 exit 10 当作失败放弃。按名定位（用户未给 id）。最终该指令被删除，返回中包含被删指令的 command_id。"

- case_id: lark_cli_2026_07_07_application_slash_command_005
  query: "帮我看看我名下都有哪些妙搭应用，顺便看看它们最近的访问量正不正常。"
  expectations: "决策点：跨域路由反混淆（S5，application vs apps）。'妙搭应用'属于低代码平台 lark-apps（apps 域）的管理范畴，与 application 域（开放平台应用自管理/斜杠指令）无关。AI 必须路由到 apps 域/lark-apps 的应用列表与监控指标能力，绝不能调用 application 域的任何 slash-command 命令（list/create/update/delete 都不行）。评分核心是'没有误用 application 域'，妙搭侧具体命令选择正确即可。"

- case_id: lark_cli_2026_07_07_application_slash_command_006
  query: "我们这个应用机器人现在配了哪些斜杠指令？给我列一下，最好带上每个指令的用途说明。"
  expectations: "决策点：命令选择正向（list 意图 + 域路由正向）。AI 应使用 application 域的斜杠指令列表命令（无需任何自有参数）获取全部指令，并向用户呈现每个指令的 command 名和 description；不需要也不应该做分页处理（上游无分页，上限 100 条天然有界）。不接受：误路由到 apps（妙搭）域、或误用创建/更新命令。输出数据包含 items 与 count 字段。"

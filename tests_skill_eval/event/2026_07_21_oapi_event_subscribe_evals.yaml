# tests_skill_eval/event/2026_07_21_oapi_event_subscribe_evals.yaml
# Generated by dev-skill-eval-writer from: docs/superpowers/specs/2026-07-21-oapi-event-subscribe-design.md
# Domain: event | Spec: 2026_07_21_oapi_event_subscribe
# 场景对齐 spec §10.4 的 6 个 AI 决策点（发现 / 选模板 dry-run / create→consume 引导 /
#   缺 scope 恢复 / suspended→reactivate / delete 高风险确认），第 7 条为强制的跨命令边界
#   (event stop vs event subscription delete，spec §3.7/§4.1「delete 不是停止本地监听的替代品」)。
# 依赖资源见 tests_skill_eval/setup/event_setup.yaml（{{RUN_TAG}} 由 entrypoint 注入，两边同值）。
# 说明：refined event subscription 端点 GA 未定、live 事件投递不作硬依赖（spec §0.3.5、§10.4）；
#   本文件全部决策点用「发现类 / dry-run / 命令与参数选择 / typed error 恢复」覆盖，不依赖真实远端投递。

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_001
  query: "我们想做个机器人，只盯着某一个特定群里的新消息去实时处理，其它群一概不管。飞书这种'只订阅单个群的新消息'的实时能力到底支不支持？要开通哪些权限、大致怎么配置？先给我讲清楚再动手。"
  expectations: "决策点：发现（list/schema 作为事实来源）。用户在问一个新能力该怎么用，AI 不应凭空捏造 target_resource 字符串、编造端点、或直接盲跑一个消费进程。正确做法：先用 event list（JSON）发现支持精细化订阅（refined_subscription）的 EventKey —— im.message.created_v1；再用 event schema im.message.created_v1（JSON）读出它的 key_templates（chat-id 模板、owner/me 模板）、所需 scopes（event:subscription:read + event:subscription:write）、支持的身份（user/bot），以及 risk（effective=write、dry_run_recommended=true）。据此如实回答'支持、按资源订阅、需要读+写两个 scope、建议先 dry-run'。不接受：跳过 list/schema 直接猜命令，或声称飞书不支持。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_002
  query: "我要正式开始接收 事件订阅测试群-{{RUN_TAG}} 这个群的新消息了。不过先别真往线上写任何东西，用安全的方式给我预览一下：这个订阅具体会做哪些操作、要用到什么资源，确认没问题我们再真的开。"
  expectations: "决策点：参数推断/模板化 + dry-run 安全预览（含 R1 规避）。用户意图是'开始接收（监听）某个具体群的新消息'，且明确要求先安全预览不写线上。AI 应：(1) 把群名 事件订阅测试群-{{RUN_TAG}} 解析成 chat_id（如用 im 群搜索按名查 oc_ 开头的 chat_id）；(2) 用 schema 里的 chat-id 模板拼出 materialized refined EventKey：im.message.created_v1/chat-id/<该群 chat_id>；(3) 走监听路径 event consume 并加 --dry-run 预览（只做解析/身份/门禁/远端计划，不创建远端、不启 bus）。硬性不接受：直接传裸 base key im.message.created_v1（会按 R1 被 invalid_argument 拒绝并指向 event schema）、自己手搓 target_resource= 字符串、或跳过预览直接实跑写远端。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_003
  query: "帮我把 事件订阅测试群-{{RUN_TAG}} 新消息的订阅在飞书服务端正式建好、长期留着就行，我暂时不想现在就挂一个一直跑的进程去收，等之后再接上实时接收。这一步先别真建，让我看看会创建成什么样。"
  expectations: "决策点：命令选择（管理面 subscription create vs 运行时 consume）+ next_action 引导。用户意图是'把远端持久订阅登记好、长期保留，现在不跑消费进程'，这属于管理面而非监听。AI 应用 event subscription create <materialized refined key>（im.message.created_v1/chat-id/<该群 chat_id>）并加 --dry-run（输出 operation/target_resource/required_scopes/planned_change 等，不发远端写）。关键在于区分：subscription create 只创建/登记远端订阅，创建成功 ≠ 已开始收消息；AI 应向用户点明 next_action —— 之后需运行 event consume <refined key> 才真正开始接收。不接受：用 consume 去'长期登记'、把 create 当成会自动持续推送、或使用裸 base key。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_004
  query: "帮我列一下我名下针对一个个具体群配的那些实时新消息订阅都有哪些。我之前自己跑的时候被提示权限不够、没列出来。到底是缺了什么权限、怎么补齐之后再重试成功？"
  expectations: "决策点：错误恢复（permission / missing_scopes + hint，保持身份重试）。列出远端订阅用 event subscription list，需要 event:subscription:read。碰到权限类 typed error 时，AI 应读结构化错误里的 missing_scopes 列表（此处应含 event:subscription:read）与 hint，如实告诉用户'缺的是哪个 scope、要给当前这个身份（--as user）授权'，授权后用原来的 --as 重跑同一条 list 命令。不接受：静默改用 bot 身份、换成别的命令绕过、裁掉功能假装成功、或把权限错误当作'不支持'放弃。评分看 AI 是否基于 missing_scopes/hint 做身份一致的恢复，而非正则匹配报错文本。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_005
  query: "我之前给 事件订阅测试群-{{RUN_TAG}} 建的那个新消息订阅好像被系统挂起了，现在这个群的新消息一条都收不到。帮我把它重新恢复、让它继续正常推送。"
  expectations: "决策点：命令选择/错误恢复（suspended → reactivate，而非删了重建）。用户不知道 remote_subscription_id（真人不会记 sub_ 开头的 id），AI 应先用 event subscription list（按该群的 target_resource 匹配）拿到对应订阅的 remote_subscription_id，再用 event subscription reactivate <remote_subscription_id> 恢复（可先 --dry-run 预览）。管理面没有 suspend/resume 命令，恢复统一走 reactivate。不接受：delete 后再 create 重建、误用 update 去'恢复'、或臆造 resume/reactive 之类不存在的命令。若能读出并转述 suspension 原因（如 authority_revoked）为加分。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_006
  query: "事件订阅测试群-{{RUN_TAG}} 这个群我们以后不用了，我早先给它建的那个服务端消息订阅也一并彻底清理掉吧，别留着占资源。"
  expectations: "决策点：高风险写确认（delete + exit-10 确认流程）。用户意图明确就是删除远端订阅本身。AI 应先用 event subscription list 按该群定位到 remote_subscription_id，再用 event subscription delete <remote_subscription_id>。删除远端共享资源是 high-risk-write：AI 应体现确认意识 —— 先向用户确认/说明这是不可逆删除及其影响，并理解首次不带确认参数执行会返回 ConfirmationRequiredError（category confirmation，exit 10），需要在确认后加 --yes 重试，而不是把 exit 10 当失败放弃；也可先 --dry-run 预览影响面。不接受：把 exit 10 当作报错终止、或与'停止本地监听'混为一谈（见 case 007 的反向边界）。"

- case_id: lark_cli_2026_07_21_oapi_event_subscribe_007
  query: "我本地正开着一个一直在收 事件订阅测试群-{{RUN_TAG}} 新消息的进程，现在先把它停下来、别再往下收了。但那个订阅本身我还想留着，说不定过阵子还会再开起来接着收。"
  expectations: "决策点：跨命令边界反混淆（event stop 本地停止 vs event subscription delete 删远端）。用户要的是'停止本地接收'且明确'远端订阅要保留'。AI 必须走本地停止路径 event stop（停 bus/消费进程），绝不能用 event subscription delete —— 那会把用户明确要留着的、可能被他人共享的远端持久订阅删掉。AI 应理解 refined consumer 本地退出不会删除远端订阅、delete 不是停止本地监听的替代品（spec §3.7/§4.1）。评分核心：选对本地 stop、且没有误用远端 delete。"

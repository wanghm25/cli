# tests_skill_eval/setup/application_setup.yaml
# 构造 application eval 依赖的测试资源。eval 前由 entrypoint 串行执行；不评分。
# 命令使用 lark-cli 通用 `api` 命令直调 spec §3 实测校准的 v7 端点——被测的
# application 域新命令在生成时尚未实现、无法 dry-run 验证，按 HARD-GATE 不得写入
# 未验证命令；`api` 命令在现有二进制上已逐条 --dry-run 验证通过（exit 0）。
# {{RUN_TAG}} 由 entrypoint 注入本次 run 的时间戳，与 eval query 同名占位同值。
# 前置（spec R1）：沙箱测试应用需已开通 application:app_slash_command:write scope 并在灰度内。

- name: "greet-{{RUN_TAG}}"
  create: "api POST /open-apis/application/v7/app_slash_commands --data '{\"command\":\"greet-{{RUN_TAG}}\",\"description\":{\"default_value\":\"打个招呼（旧版描述）\"}}' --as bot"   # 供 case 002 幂等重跑：预建同名指令，旧描述与 query 不同

- name: "standup-{{RUN_TAG}}"
  create: "api POST /open-apis/application/v7/app_slash_commands --data '{\"command\":\"standup-{{RUN_TAG}}\",\"description\":{\"default_value\":\"站会（待修改）\"}}' --as bot"   # 供 case 003 按名改描述

- name: "obsolete-{{RUN_TAG}}"
  create: "api POST /open-apis/application/v7/app_slash_commands --data '{\"command\":\"obsolete-{{RUN_TAG}}\",\"description\":{\"default_value\":\"废弃指令\"}}' --as bot"   # 供 case 004 删除

- name: "weather-{{RUN_TAG}}"
  provide: "该斜杠指令是 case 001 的被测创建对象——决策点本身就是「AI 能否自主创建新指令并组装 i18n 参数」，setup 绝不能预建它（预建会让这个决策点失去意义）。此条不代表需要人工介入，只是登记该命名实体，满足『query 引用的每个命名实体必须在 setup 里有 create 或 provide』的校验要求；entrypoint 对 provide 项从不阻断评测，也不会创建/删除任何东西。"   # 仅用于 lint 覆盖，不预建、不 check
